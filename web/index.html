<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a1838">
<title>Bridge Squad: Endless</title>
<meta name="description" content="Endless levels, nine weapons and eight worlds for noclipepe's Bridge Squad. The original game loads from noclipepe's site and is patched in your browser.">
<meta property="og:title" content="Bridge Squad: Endless">
<meta property="og:description" content="Endless levels, nine weapons and eight worlds for noclipepe's Bridge Squad.">
<meta property="og:image" content="cover.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="cover.svg">
<style>
  html,body{margin:0;height:100%;background:#0a1838;color:#fff;font-family:"Arial Black","Segoe UI Black",Impact,Arial,sans-serif}
  #boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;padding:24px;box-sizing:border-box}
  #boot img{width:min(560px,92vw);border-radius:18px;box-shadow:0 12px 40px rgba(0,0,0,.5)}
  #msg{font-size:15px;letter-spacing:.04em;opacity:.9;max-width:34em;line-height:1.5;font-family:Arial,sans-serif;font-weight:700}
  #msg a{color:#ffd23a}
</style>
</head>
<body>
<div id="boot"><img src="cover.svg" alt="Bridge Squad: Endless cover art"><div id="msg">LOADING BRIDGE SQUAD…</div></div>
<script>
// Loads the original Bridge Squad from noclipepe's site, applies the level kit's patches
// (patches.json, generated by build.py) and runs it. Nothing from the original is hosted here.
(async () => {
  const ORIGIN = 'https://noclipepe.pages.dev/bridge/';
  const msg = document.getElementById('msg');
  const fail = why => { msg.innerHTML = why + '<br><br>You can still play <a href="' + ORIGIN + '">the original Bridge Squad</a>.'; };
  try {
    const [html, patches] = await Promise.all([
      fetch(ORIGIN, { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('original game: HTTP ' + r.status); return r.text(); }),
      fetch('patches.json', { cache: 'no-cache' }).then(r => r.json()),   // always revalidate: the patches change whenever the original does
    ]);
    let src = html;
    for (const [from, to, n] of patches) {
      const parts = src.split(from);
      if (parts.length - 1 !== n) return fail('The original game has been updated since this level kit was built, so the patches no longer fit.');
      src = parts.join(to);
    }
    // three.js comes from the original site too; levels.js and the home link resolve next to this page
    src = src.split('src="levels.js"').join('src="levels.js?v=' + Math.floor(Date.now() / 60000) + '"');   // skip stale cached copies of the levels
    src = src.split("x.open('GET','three.min.js')").join("x.open('GET','" + ORIGIN + "three.min.js')");
    src = src.split('</body>').join('<a href="' + ORIGIN + '" target="_blank" rel="noopener" style="position:fixed;left:8px;bottom:34px;z-index:9;font:700 11px Arial,sans-serif;color:rgba(255,255,255,.75);text-decoration:none;text-shadow:0 1px 2px #000">Original game by @noclipepe ↗</a></body>');
    document.open(); document.write(src); document.close();
  } catch (e) {
    fail('Could not load the original game (' + e.message + ').');
  }
})();
</script>
</body>
</html>
